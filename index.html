<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大隅半島バスロケーションシステム（アイコン・表示制限対応版）</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    #time-display {
      position: absolute; top: 10px; left: 10px; z-index: 99;
      background: white; padding: 10px; font-size: 18px; border: 2px solid black;
    }
  </style>
</head>
<body>
  <div id="time-display">時刻: --:--:--</div>
  <div id="map"></div>

  <script>
    // 【設定1】停留所の座標データ
    const stops = {
      "kanoya": { lat: 31.3783, lng: 130.8524 }, 
      "kinko":  { lat: 31.2381, lng: 130.7744 },
      "nejime": { lat: 31.2185, lng: 130.7641 }
    };

    // 【設定2】時刻表データ
    const schedule = [
      { stop_id: "kanoya", time: "16:40:00" },
      { stop_id: "kinko",  time: "16:50:00" },
      { stop_id: "nejime", time: "17:00:00" }
    ];

    // 【設定3】区間ごとの詳細なルート（通過点）のデータ
    const pathSegments = [
      [
        stops["kanoya"],
        { lat: 31.3450, lng: 130.8250 },
        { lat: 31.2850, lng: 130.7950 },
        stops["kinko"]
      ],
      [
        stops["kinko"],
        { lat: 31.2280, lng: 130.7680 },
        stops["nejime"]
      ]
    ];

    let map;
    let busMarker;

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: stops[schedule[0].stop_id],
        zoom: 11,
      });

      for (let i = 0; i < schedule.length; i++) {
        new google.maps.Marker({ position: stops[schedule[i].stop_id], map: map, label: String(i + 1) });
      }

      const allPathCoords = [];
      pathSegments.forEach(segment => {
        segment.forEach(point => allPathCoords.push(point));
      });

      const routePath = new google.maps.Polyline({
        path: allPathCoords,
        geodesic: true,
        strokeColor: "#FF0000",
        strokeOpacity: 0.5,
        strokeWeight: 4,
      });
      routePath.setMap(map);

      // ★変更点：バスのマーカーをオリジナルの画像に設定
      busMarker = new google.maps.Marker({
        position: stops[schedule[0].stop_id],
        map: map,
        icon: {
          url: "bus.png", // ★アップロードした画像ファイル名に合わせてください
          scaledSize: new google.maps.Size(64, 64), // 64px * 64px で表示
          anchor: new google.maps.Point(32, 32)     // 画像の中心（32, 32）が地図の座標に合うように調整
        },
        visible: false // 初期状態は非表示（時間の判定後に表示させるため）
      });

      setInterval(updateBusPosition, 1000);
    }

    function timeToSeconds(timeStr) {
      const parts = timeStr.split(":");
      return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
    }

    function getPointAlongPath(path, fraction) {
      let totalDistance = 0;
      const distances = [];
      
      for (let i = 0; i < path.length - 1; i++) {
        const d = google.maps.geometry.spherical.computeDistanceBetween(path[i], path[i+1]);
        distances.push(d);
        totalDistance += d;
      }

      const targetDistance = totalDistance * fraction;
      let currentDistance = 0;

      for (let i = 0; i < path.length - 1; i++) {
        if (currentDistance + distances[i] >= targetDistance) {
          const segmentFraction = (targetDistance - currentDistance) / distances[i];
          return google.maps.geometry.spherical.interpolate(path[i], path[i+1], segmentFraction);
        }
        currentDistance += distances[i];
      }
      return path[path.length - 1];
    }

    function updateBusPosition() {
      const now = new Date();
      document.getElementById("time-display").innerText = "時刻: " + now.toLocaleTimeString();
      const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

      const firstTime = timeToSeconds(schedule[0].time);
      const lastTime = timeToSeconds(schedule[schedule.length - 1].time);

      // ★NEW：表示期間の境界値（始発の5分前＝300秒前、終着の3分後＝180秒後）
      const showStartTime = firstTime - 300;
      const hideEndTime = lastTime + 180;

      // ★NEW：指定された期間「外」ならバスを隠して処理を終わる
      if (currentSeconds < showStartTime || currentSeconds > hideEndTime) {
        busMarker.setVisible(false);
        return;
      }

      // ★NEW：指定された期間「内」ならバスを表示する
      busMarker.setVisible(true);

      // 出発前の待機時間（5分前から始発まで）は始発停留所に固定
      if (currentSeconds < firstTime) {
        busMarker.setPosition(stops[schedule[0].stop_id]);
        return;
      }
      // 到着後の待機時間（到着から3分後まで）は終着停留所に固定
      if (currentSeconds > lastTime) {
        busMarker.setPosition(stops[schedule[schedule.length - 1].stop_id]);
        return;
      }

      for (let i = 0; i < schedule.length - 1; i++) {
        const timeA = timeToSeconds(schedule[i].time);
        const timeB = timeToSeconds(schedule[i+1].time);

        if (currentSeconds >= timeA && currentSeconds <= timeB) {
          const fraction = (currentSeconds - timeA) / (timeB - timeA);
          const segmentPath = pathSegments[i].map(p => new google.maps.LatLng(p.lat, p.lng));
          
          const currentPos = getPointAlongPath(segmentPath, fraction);
          busMarker.setPosition(currentPos);
          break;
        }
      }
    }
  </script>
  
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBqcUNb7-_olnNZKHR_UyfqB5Zi2KOI5X8&libraries=geometry&callback=initMap"></script>
</body>
</html>
